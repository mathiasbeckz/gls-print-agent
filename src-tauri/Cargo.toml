[package]
name = "gls-print-agent"
version = "0.9.0"
description = "GLS Print Agent for remote label printing"
authors = ["Josephine Nord"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.9.5", features = ["tray-icon", "image-png"] }
tauri-plugin-log = "2"
tauri-plugin-store = "2"
base64 = "0.22"
tempfile = "3"
# HTTP client + async runtime for the background polling task that drives
# label fetching. Lives in Rust (not the WebView) so it keeps running while
# the window is minimised, hidden, or behind other apps — which the previous
# TS-side fetch loop could not, due to WKWebView background throttling.
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
tokio = { version = "1", features = ["full"] }
# PDF manipulation for watermarking labels with the merchant's logo before
# printing. lopdf parses and re-saves the GLS PDF; image decodes the embedded
# logo PNG; flate2 compresses the raw RGB bytes for the PDF image XObject.
lopdf = "0.36"
image = { version = "0.25", default-features = false, features = ["png"] }
flate2 = "1"

# macOS-specific dependencies
[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.26"
objc = "0.2"
